[project]
name = "arbiter-mcp"
version = "0.1.0"
description = "MCP-powered AI reasoning engine for production incident investigation"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "mcp[cli]>=1.0.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "click>=8.0",
    "python-dateutil>=2.8",
    "httpx>=0.27",
    "weasyprint>=62.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.4",
]

[project.scripts]
arbiter = "arbiter.cli:main"
arbiter-mcp = "arbiter.mcp_server:run_server"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arbiter = ["config/*.yaml", "config/templates/*.j2", "config/templates/*.css"]

# --- Formatting ---

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["arbiter"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# --- Linting ---

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length — handled by black
    "E741",   # ambiguous variable name
    "B008",   # function call in default arg — click uses this
    "SIM108", # ternary — sometimes less readable
    "TC001",  # type-checking imports
    "TC003",  # type-checking imports for stdlib
    "UP042",  # StrEnum
]

[tool.ruff.lint.isort]
known-first-party = ["arbiter"]

# --- Testing ---

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
